name: PR Compilation Check

on:
  pull_request:

jobs:
  build:
    name: Compile Check
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore BoardGamesApp/BookingBoardGames/BookingBoardGames.sln

    - name: Build BookingBoardGames
      run: dotnet build BoardGamesApp/BookingBoardGames/BookingBoardGames.csproj --no-restore -c Release

    - name: Build BookingBoardGames.Data
      run: dotnet build BoardGamesApp/BookingBoardGames.Data/BookingBoardGames.Data.csproj --no-restore -c Release

    - name: Build BookingBoardGames.Api
      run: dotnet build BoardGamesApp/BookingBoardGamesWeb/BookingBoardGames.Api.csproj --no-restore -c Release
